name: Feature request
description: 提出新能力或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 请描述场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 守卫/规则（检测能力）
        - 数据流与污点传播
        - 审计链与取证
        - 技能体检与合约
        - 接入层（SDK/MCP/框架适配）
        - 工作台与 API
        - 文档与部署
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与权衡
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR 实现
        - label: 我可以提供测试场景/数据

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows runner 默认 cp1252，强制 UTF-8 以便中文输出与测试稳定
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor
        run: python -m agentjudge doctor

      - name: UTF-8 console regression (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows runner 控制台是 cp1252；CLI 必须能正常输出中文
          $env:PYTHONIOENCODING = "cp1252"
          python -m agentjudge doctor
          python -m agentjudge rules test "rm -rf ~"
          python -m agentjudge audit verify

      - name: Scenario, corpus and regression guard
        run: |
          python -m agentjudge eval --report var/reports/eval.json \
            --baseline datasets/baseline.json --check

      - name: Ledger export smoke test
        run: |
          python -m agentjudge audit export --format csv --out var/reports/ledger.csv
          python -m agentjudge audit export --format html --out var/reports/ledger.html

      - name: Audit chain verification
        run: python -m agentjudge audit verify

      - name: Upload evaluation report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            var/reports/eval.json
            var/reports/eval.md
            var/reports/ledger.csv
            var/reports/ledger.html
          retention-days: 14

  skill-check:
    name: demo skill inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Demo skill must be quarantined
        run: |
          python -m agentjudge skill inspect examples/skills/note-taker --json > /tmp/skill.json || true
          python - <<'PY'
          import json
          report = json.load(open("/tmp/skill.json", encoding="utf-8"))
          assert report["trust"] == "quarantined", report["trust"]
          assert "network" in report["observed"]
          print("demo skill quarantined as expected")
          PY
